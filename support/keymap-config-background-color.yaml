# This file has just an extra configuration to apply a background color to the
# generated SVG output.

# Configuration for the "rendering" part of Keymap Drawer
draw_config:
  svg_extra_style: |
    rect.ghost { fill: #7b7e81; }
    svg.keymap { background-color: #000000; }
    rect.key.noswitch {
      fill: #1a1d22;
      stroke: #6b7280;
      stroke-dasharray: 4 3;
      opacity: 0.5;
    }
    text.fr.tap,
    text.fr.shifted,
    text.fr.hold {
      fill: #e8a030;
    }
