<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sofle Corne 42 — couches 0–5</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0.35rem 0;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      padding: 0 0.5rem 0.15rem;
      scroll-margin-top: 2rem;
    }
    figcaption {
      font-size: 0.8rem;
      margin: 0.15rem 0 0.1rem;
      opacity: 0.85;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      vertical-align: top;
    }
    #shortcuts-hint {
      scroll-margin-top: 0.5rem;
    }
    .shortcuts-hint {
      position: sticky;
      top: 0;
      z-index: 1;
      margin: 0 0 0.65rem;
      padding: 0.3rem 0.55rem;
      background: #252525;
      border-bottom: 1px solid #333;
      font-size: 0.75rem;
      line-height: 1.35;
      opacity: 0.95;
    }
    .shortcuts-hint--expanded {
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      line-height: 1.4;
      margin-bottom: 1rem;
    }
    .shortcuts-hint-compact {
      margin: 0;
    }
    .shortcuts-hint--expanded .shortcuts-hint-compact {
      display: none;
    }
    .shortcuts-hint-details[hidden] {
      display: none;
    }
    .shortcuts-hint kbd {
      display: inline-block;
      padding: 0.1em 0.35em;
      border-radius: 3px;
      background: #333;
      font-family: inherit;
      font-size: 0.9em;
    }
    .shortcuts-hint-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr));
      gap: 0.35rem 0.75rem;
      font-size: 0.78rem;
      line-height: 1.35;
    }
    .shortcuts-hint-list li {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 0.35rem;
    }
    .shortcuts-hint-list .sec-keys {
      flex: 0 0 auto;
      white-space: nowrap;
      text-align: left;
    }
    .shortcuts-hint-list .sec-name {
      flex: 1 1 auto;
      min-width: 0;
      opacity: 0.92;
    }
    .shortcuts-hint-foot {
      margin: 0.55rem 0 0;
      padding-top: 0.45rem;
      border-top: 1px solid #383838;
      font-size: 0.78rem;
      opacity: 0.95;
    }
    figcaption .kbd-ref {
      margin-left: 0.35em;
      padding: 0.1em 0.4em;
      border-radius: 3px;
      background: #2a2a2a;
      font-size: 0.8em;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0.95;
    }
    figcaption .nuphy-only {
      margin-left: 0.4em;
      padding: 0.1em 0.45em;
      border-radius: 3px;
      background: #3d2a12;
      color: #e8a030;
      font-size: 0.75em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="shortcuts-hint" id="shortcuts-hint" aria-expanded="false">
    <p class="shortcuts-hint-compact">
      Sofle Corne 42 — raccourcis · <kbd>H</kbd> aide · <kbd>J</kbd> / <kbd>K</kbd> sections
      · couche 4 Mouse = Nuphy Corne uniquement
    </p>
    <div class="shortcuts-hint-details" id="shortcuts-hint-details" hidden>
      <ul class="shortcuts-hint-list">
        <li><span class="sec-keys"><kbd>0</kbd> <kbd>A</kbd></span><span class="sec-name">Base</span></li>
        <li><span class="sec-keys"><kbd>1</kbd> <kbd>B</kbd></span><span class="sec-name">Nav</span></li>
        <li><span class="sec-keys"><kbd>2</kbd> <kbd>C</kbd></span><span class="sec-name">Symbols</span></li>
        <li><span class="sec-keys"><kbd>3</kbd> <kbd>D</kbd></span><span class="sec-name">Functions</span></li>
        <li><span class="sec-keys"><kbd>4</kbd> <kbd>E</kbd></span><span class="sec-name">Mouse (Nuphy Corne uniquement)</span></li>
        <li><span class="sec-keys"><kbd>5</kbd> <kbd>F</kbd></span><span class="sec-name">Adjust</span></li>
        <li><span class="sec-keys"><kbd>9</kbd> <kbd>R</kbd></span><span class="sec-name">Référence RC</span></li>
        <li><span class="sec-keys"><kbd>H</kbd></span><span class="sec-name">Aide</span></li>
      </ul>
      <p class="shortcuts-hint-foot">
        <kbd>J</kbd> section suivante · <kbd>K</kbd> section précédente
      </p>
    </div>
  </div>
  <figure id="layer-0">
    <figcaption>0 — Base <span class="kbd-ref">A</span></figcaption>
    <img src="sofle-layer0-main.svg" alt="Couche Base" width="900" height="428" loading="lazy" />
  </figure>
  <figure id="layer-1">
    <figcaption>1 — Nav <span class="kbd-ref">B</span></figcaption>
    <img src="sofle-layer1-navigation.svg" alt="Couche Nav" width="900" height="428" loading="lazy" />
  </figure>
  <figure id="layer-2">
    <figcaption>2 — Symbols <span class="kbd-ref">C</span></figcaption>
    <img src="sofle-layer2-symbols.svg" alt="Couche Symbols" width="900" height="428" loading="lazy" />
  </figure>
  <figure id="layer-3">
    <figcaption>3 — Functions <span class="kbd-ref">D</span></figcaption>
    <img src="sofle-layer3-functions.svg" alt="Couche Functions" width="900" height="428" loading="lazy" />
  </figure>
  <figure id="layer-4">
    <figcaption>4 — Mouse <span class="kbd-ref">E</span> <span class="nuphy-only">Nuphy Corne uniquement</span></figcaption>
    <img src="sofle-layer4-mouse.svg" alt="Couche Mouse — Nuphy Corne uniquement" width="900" height="428" loading="lazy" />
  </figure>
  <figure id="layer-5">
    <figcaption>5 — Adjust <span class="kbd-ref">F</span></figcaption>
    <img src="sofle-layer5-adjust.svg" alt="Couche Adjust" width="900" height="428" loading="lazy" />
  </figure>
  <figure id="layer-ref">
    <figcaption>Référence — indices matrice RC (SOFLE60) <span class="kbd-ref">R</span></figcaption>
    <img src="sofle-layer-rc-reference.svg" alt="Référence RC" width="900" height="428" loading="lazy" />
  </figure>
  <script>
    (function () {
      var codeTargets = {
        Digit0: "layer-0", Digit1: "layer-1", Digit2: "layer-2",
        Digit3: "layer-3", Digit4: "layer-4", Digit5: "layer-5",
        Digit9: "layer-ref",
        Numpad0: "layer-0", Numpad1: "layer-1", Numpad2: "layer-2",
        Numpad3: "layer-3", Numpad4: "layer-4", Numpad5: "layer-5",
        Numpad9: "layer-ref"
      };
      var letterTargets = {
        a: "layer-0", b: "layer-1", c: "layer-2",
        d: "layer-3", e: "layer-4", f: "layer-5",
        r: "layer-ref"
      };
      var sectionOrder = [
        "shortcuts-hint",
        "layer-0", "layer-1", "layer-2", "layer-3", "layer-4", "layer-5",
        "layer-ref"
      ];

      function scrollToId(id) {
        var el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function currentSectionIndex() {
        var hintEl = document.getElementById("shortcuts-hint");
        var pad = hintEl && hintEl.classList.contains("shortcuts-hint--expanded") ? 52 : 36;
        var y = window.scrollY + pad;
        var idx = 0;
        for (var i = 0; i < sectionOrder.length; i++) {
          var el = document.getElementById(sectionOrder[i]);
          if (!el) continue;
          if (el.offsetTop <= y) idx = i;
          else break;
        }
        return idx;
      }

      function scrollToSectionDelta(delta) {
        var n = sectionOrder.length;
        if (n === 0) return;
        scrollToId(sectionOrder[(currentSectionIndex() + delta + n) % n]);
      }

      function collapseShortcutsHint() {
        var bar = document.getElementById("shortcuts-hint");
        var details = document.getElementById("shortcuts-hint-details");
        if (bar) {
          bar.classList.remove("shortcuts-hint--expanded");
          bar.setAttribute("aria-expanded", "false");
        }
        if (details) details.hidden = true;
      }

      document.addEventListener("keydown", function (e) {
        if (e.defaultPrevented) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        var tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (e.target && e.target.isContentEditable)) return;

        var k0 = e.key;
        if (k0 && k0.length === 1 && k0.toLowerCase() === "h") {
          e.preventDefault();
          var bar = document.getElementById("shortcuts-hint");
          var details = document.getElementById("shortcuts-hint-details");
          if (bar && details) {
            var exp = bar.classList.toggle("shortcuts-hint--expanded");
            details.hidden = !exp;
            bar.setAttribute("aria-expanded", exp ? "true" : "false");
          }
          scrollToId("shortcuts-hint");
          return;
        }
        var byCode = codeTargets[e.code];
        if (byCode) {
          e.preventDefault();
          collapseShortcutsHint();
          scrollToId(byCode);
          return;
        }
        var k = e.key;
        if (k && k.length === 1) {
          var lk = k.toLowerCase();
          if (lk === "j") {
            e.preventDefault();
            collapseShortcutsHint();
            scrollToSectionDelta(1);
            return;
          }
          if (lk === "k") {
            e.preventDefault();
            collapseShortcutsHint();
            scrollToSectionDelta(-1);
            return;
          }
          var lid = letterTargets[lk];
          if (lid) {
            e.preventDefault();
            collapseShortcutsHint();
            scrollToId(lid);
          }
        }
      });
    })();
  </script>
</body>
</html>
