# Kconfig utilisateur — Corne MX BT (nice_nano_v2 + shield corne_left / corne_right).
# Ne s’applique pas aux builds Sofle (board sofle_choc_pro_*).

CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_KEYBOARD_NAME="Nuphy Corne"

CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# RGB_TOG ne doit pas couper EXT_POWER : OLED et LED partagent le 3,3 V.
# Sinon RGB off éteint les écrans, et RGB on ne les réinitialise pas.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Souris HID (couche 4 Mouse). Change le descripteur : réapparier après flash.
CONFIG_ZMK_MOUSE=y

# KeyPeek / ZMK Studio RPC (moitié gauche : snippet studio-rpc-usb-uart + raw_hid_adapter)
CONFIG_ZMK_STUDIO=y
