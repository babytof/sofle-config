# Kconfig utilisateur — Corne MX BT (nice_nano_v2 + shield corne_left / corne_right).
# Ne s’applique pas aux builds Sofle (board sofle_choc_pro_*).

CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_KEYBOARD_NAME="Nuphy Corne"

CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
# OLED : % réel (l’icône n’a que 5 paliers). Mesure toutes les 15 s.
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=15

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# RGB_TOG coupe le 3,3 V commuté (VCC) : LED hors tension.
# Tant que l’OLED est encore sur VCC, l’écran s’éteint avec (test VDD vs VCC).
# Après fil OLED → pad SWD VDD : remettre =y en prod, écran indépendant.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# Souris HID (couche 4 Mouse). Change le descripteur : réapparier après flash.
CONFIG_ZMK_MOUSE=y

# KeyPeek / ZMK Studio RPC (moitié gauche : snippet studio-rpc-usb-uart + raw_hid_adapter)
CONFIG_ZMK_STUDIO=y
